version: '3.9'

services:

  # ─── MongoDB ──────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: billflow_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-secret}
      MONGO_INITDB_DATABASE: billflow
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    networks:
      - billflow_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: production
    container_name: billflow_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-secret}@mongo:27017/billflow?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      COMPANY_NAME: ${COMPANY_NAME:-BillFlow Technologies Pvt. Ltd.}
      COMPANY_GSTIN: ${COMPANY_GSTIN:-27AABCT1234F1Z5}
      COMPANY_STATE: ${COMPANY_STATE:-Maharashtra}
      COMPANY_STATE_CODE: ${COMPANY_STATE_CODE:-27}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - backend_logs:/app/logs
    networks:
      - billflow_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Frontend (Nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api
        VITE_APP_NAME: BillFlow
    container_name: billflow_ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro          # mount SSL certs if available
    networks:
      - billflow_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Mongo Express (dev only) ─────────────────────────
  mongo-express:
    image: mongo-express:1.0
    container_name: billflow_mongoui
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS:-secret}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-secret}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASS:-adminpass}
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    networks:
      - billflow_net
    profiles:
      - dev                              # only starts with: docker compose --profile dev up

volumes:
  mongo_data:
    driver: local
  backend_logs:
    driver: local

networks:
  billflow_net:
    driver: bridge
