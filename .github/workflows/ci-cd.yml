name: BillFlow CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/billflow

jobs:
  # ─── Lint & Test Backend ────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Create test .env
        working-directory: backend
        run: |
          cat > .env << EOF
          NODE_ENV=test
          PORT=5001
          MONGO_URI=mongodb://localhost:27017/billflow_test
          JWT_SECRET=test_jwt_secret_at_least_32_chars_long
          JWT_EXPIRES_IN=1d
          JWT_REFRESH_SECRET=test_refresh_secret_at_least_32_chars
          BCRYPT_SALT_ROUNDS=4
          ALLOWED_ORIGINS=http://localhost:3000
          EOF

      - name: Run backend tests
        working-directory: backend
        run: npm test --if-present

  # ─── Lint & Build Frontend ──────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_APP_NAME: BillFlow

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ─── Docker Build & Push ────────────────────────────
  docker:
    name: Docker Build & Push
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_APP_NAME=BillFlow
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ui:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ─── Deploy to Render ───────────────────────────────
  deploy:
    name: Deploy
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy (backend)
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" \
            -H "Content-Type: application/json" || true

      - name: Trigger Vercel deploy (frontend)
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" || true

      - name: Notify deployment
        run: echo "✅ BillFlow ${{ github.sha }} deployed to production"
